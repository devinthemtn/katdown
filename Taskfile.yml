version: '3'

vars:
  APP_NAME: "katdown"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Linux GTK version. 3 builds against webkit2gtk-4.1 (what Ubuntu 24.04 ships
  # as libwebkit2gtk-4.1-dev); GTK=4 builds against gtk4 + webkitgtk-6.0.
  GTK: '{{.GTK | default "3"}}'
  EXTRA_TAGS: '{{if eq .GTK "3"}}gtk3{{end}}'
  # Name of the WSL command that runs the Windows build (installed by install-windows).
  WIN_WRAPPER: katdown-win
  # Version stamped into the binary (main.version) by the platform builds:
  # "2.0.0" on a tag, "2.0.0-15-gea54352" past one, "-dirty" with uncommitted
  # changes. Empty (keeping version.go's default) outside a git checkout.
  # Override with `task build VERSION=...`.
  VERSION:
    sh: 'git describe --tags --always --dirty 2>/dev/null | sed "s/^v//" || true'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    desc: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    desc: Runs the application in live-reloading dev mode; FILE=README.md opens that file
    # wails3 dev runs the build and run tasks as child processes, which read these from the environment.
    env:
      FILE: '{{.FILE}}'
      GTK: '{{.GTK}}'
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    desc: Runs the Go and frontend tests
    cmds:
      - task: test:go
      - task: test:frontend

  test:go:
    desc: Runs the Go tests
    cmds:
      - go test -tags "{{.EXTRA_TAGS}}" ./...

  test:frontend:
    desc: Runs the frontend tests (Vitest)
    deps: [common:install:frontend:deps]
    dir: frontend
    cmds:
      - npm test

  # Cross-compiles bin/katdown.exe (WebView2 needs no cgo, so no mingw toolchain required).
  build-windows:
    desc: Builds bin/katdown.exe
    cmds:
      - task: windows:build

  # Installer for Windows users without dev tools: bin/katdown-amd64-installer.exe.
  # Installs per user (no admin), adds Start Menu and desktop shortcuts and the .md
  # Open with entry, and installs the WebView2 runtime if it's missing. Needs makensis.
  build-win-installer:
    desc: Builds bin/katdown-amd64-installer.exe (needs makensis)
    cmds:
      - task: windows:package
        vars:
          INSTALL_SCOPE: user

  # Also adds a launcher entry (build/linux/katdown.desktop.in) with the app icon.
  # In WSL it then runs install-windows too, so the Windows copy stays in step;
  # skip that with `task install WINDOWS=false`.
  install:
    desc: Installs katdown (and a katDown alias) to ~/.local/bin with an app launcher entry; in WSL, also the Windows build
    platforms: [linux]
    deps: [build]
    vars:
      WINDOWS: '{{.WINDOWS | default "auto"}}'
      IN_WSL:
        sh: '[ -n "$WSL_DISTRO_NAME" ] || grep -qi microsoft /proc/sys/kernel/osrelease 2>/dev/null && echo true || echo false'
    cmds:
      - install -Dm755 {{.BIN_DIR}}/katdown "$HOME/.local/bin/katdown"
      # katDown works too: a symlink, so it always runs the installed binary.
      - ln -sfn katdown "$HOME/.local/bin/katDown"
      - install -Dm644 build/appicon.png "$HOME/.local/share/katdown/katdown.png"
      - sed -e "s|@BIN@|$HOME/.local/bin/katdown|" -e "s|@ICON@|$HOME/.local/share/katdown/katdown.png|" build/linux/katdown.desktop.in > {{.BIN_DIR}}/katdown.desktop
      - install -Dm644 {{.BIN_DIR}}/katdown.desktop "$HOME/.local/share/applications/katdown.desktop"
      - cmd: update-desktop-database -q "$HOME/.local/share/applications" 2>/dev/null
        ignore_error: true
      - task: install-windows
        if: '{{if eq .WINDOWS "false"}}false{{else if eq .WINDOWS "true"}}true{{else}}{{.IN_WSL}}{{end}}'

  # From WSL: copies katdown.exe to %LOCALAPPDATA%\Programs\katdown, then adds a
  # Start Menu shortcut and registers it for .md files (build/windows/install.ps1),
  # and installs ~/.local/bin/$WIN_WRAPPER to run it from the WSL shell.
  # If the install dir isn't on the Windows PATH it asks whether to add it
  # (build/windows/path.ps1); answer up front with WIN_PATH=true or WIN_PATH=false.
  install-windows:
    desc: From WSL, installs katdown.exe for the Windows user, plus ~/.local/bin/katdown-win
    platforms: [linux]
    deps: [build-windows]
    interactive: true
    vars:
      WIN_PATH: '{{.WIN_PATH | default "ask"}}'
      # Windows install dir, resolved through WSL interop (empty outside WSL).
      WIN_INSTALL_DIR:
        sh: '{{if .WIN_INSTALL_DIR}}echo "{{.WIN_INSTALL_DIR}}"{{else}}command -v wslpath >/dev/null && d=$(cmd.exe /c echo %LOCALAPPDATA% 2>/dev/null | tr -d "\r") && [ -n "$d" ] && echo "$(wslpath "$d")/Programs/katdown" || true{{end}}'
    preconditions:
      - sh: '[ -n "{{.WIN_INSTALL_DIR}}" ]'
        msg: "not in WSL; set WIN_INSTALL_DIR"
    cmds:
      - install -Dm755 {{.BIN_DIR}}/katdown.exe "{{.WIN_INSTALL_DIR}}/katdown.exe"
      - powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w build/windows/install.ps1)" -Exe "$(wslpath -w "{{.WIN_INSTALL_DIR}}/katdown.exe")"
      - cmd: |
          dir="$(wslpath -w "{{.WIN_INSTALL_DIR}}")"
          path_ps() { powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(wslpath -w build/windows/path.ps1)" -Dir "$dir" -Mode "$1"; }
          if path_ps check; then echo "$dir is on the Windows PATH"; exit 0; fi
          case "{{.WIN_PATH}}" in
            true) add=y ;;
            false) add=n ;;
            *) add=n; if [ -t 0 ]; then printf '%s is not on the Windows PATH. Add it? [y/N] ' "$dir"; read -r add || add=n; fi ;;
          esac
          case "$add" in
            [yY]*) path_ps add && echo "Added $dir to the Windows PATH; open a new Windows terminal to use it" ;;
            *) echo "Not added to the Windows PATH; to add it later: task install-windows WIN_PATH=true" ;;
          esac
      - sed "s|@EXE@|{{.WIN_INSTALL_DIR}}/katdown.exe|" build/windows/katdown-win.sh > {{.BIN_DIR}}/{{.WIN_WRAPPER}}
      - install -Dm755 {{.BIN_DIR}}/{{.WIN_WRAPPER}} "$HOME/.local/bin/{{.WIN_WRAPPER}}"

  # Wails rewrites build/linux/nfpm/nfpm.yaml with GTK 4 package dependencies;
  # with GTK=3 (the default) they are switched to the GTK 3 / webkit2gtk-4.1 ones.
  update-build-assets:
    desc: Regenerates build assets from build/config.yml (run after changing name, version or copyright)
    cmds:
      - task: common:update:build-assets
      - cmd: |
          [ "{{.GTK}}" = "3" ] || exit 0
          sed -E -i.bak \
            -e 's/^( +- )libgtk-4-1$/\1libgtk-3-0/' \
            -e 's/^( +- )libwebkitgtk-6\.0-4$/\1libwebkit2gtk-4.1-0/' \
            -e 's/^( +- )gtk4$/\1gtk3/' \
            -e 's/^( +- )webkitgtk6\.0$/\1webkit2gtk4.1/' \
            -e 's/^( +- )webkitgtk-6\.0$/\1webkit2gtk-4.1/' \
            -e 's/^# Default dependencies for the GTK4 .*/# Dependencies for the GTK3 + WebKit2GTK 4.1 stack (katdown builds with -tags gtk3; set by update-build-assets in Taskfile.yml)/' \
            build/linux/nfpm/nfpm.yaml
          rm build/linux/nfpm/nfpm.yaml.bak
      # Wails' regenerated nfpm.yaml lacks the katDown alias; add it back after the katdown binary.
      - cmd: |
          grep -q '/usr/local/bin/katDown' build/linux/nfpm/nfpm.yaml && exit 0
          awk '{print} /dst: "\/usr\/local\/bin\/katdown"/ {print "  - src: \"katdown\"\n    dst: \"/usr/local/bin/katDown\"\n    type: symlink"}' \
            build/linux/nfpm/nfpm.yaml > build/linux/nfpm/nfpm.yaml.tmp
          mv build/linux/nfpm/nfpm.yaml.tmp build/linux/nfpm/nfpm.yaml

  # Step 1 of a release, on a branch: sets the version in build/config.yml and
  # version.go, regenerates the build assets from it, and dates the changelog's
  # Unreleased section. Review, commit as "Release X.Y.Z", and merge the PR.
  release:prepare:
    desc: Bumps the version and dates the changelog for a release (RELEASE=X.Y.Z or vX.Y.Z)
    requires:
      vars: [RELEASE]
    vars:
      # A leading v is fine: RELEASE=v2.2.0 and RELEASE=2.2.0 both work.
      VER: '{{trimPrefix "v" .RELEASE}}'
      DATE:
        sh: date +%F
    preconditions:
      - sh: echo "{{.VER}}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
        msg: "RELEASE must look like 2.2.0 or v2.2.0, got '{{.RELEASE}}'"
      - sh: grep -q '^## Unreleased$' CHANGELOG.md
        msg: "CHANGELOG.md has no '## Unreleased' section"
      - sh: '! git rev-parse -q --verify "refs/tags/v{{.VER}}" >/dev/null'
        msg: "tag v{{.VER}} already exists"
    cmds:
      - |
        sed -E -i 's/^(  version: )"[^"]*"/\1"{{.VER}}"/' build/config.yml
      - sed -E -i 's/^var version = "[^"]*"/var version = "{{.VER}}"/' version.go
      - sed -i 's/^## Unreleased$/## {{.VER}} — {{.DATE}}/' CHANGELOG.md
      - task: update-build-assets
      - git status --short

  # Step 2, on main after the release PR is merged: tags the merge commit, builds
  # the Linux binary, the Windows exe and the per-user installer stamped with the
  # version, and publishes them with SHA256SUMS as a GitHub release whose notes
  # are the version's CHANGELOG.md section. Needs makensis and an authed gh.
  release:
    desc: Tags main and publishes a GitHub release with Linux and Windows builds
    platforms: [linux]
    vars:
      RELEASE:
        sh: sed -n 's/^var version = "\(.*\)"/\1/p' version.go
      TAG: 'v{{.RELEASE}}'
      DIST: '{{.BIN_DIR}}/release'
    preconditions:
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = main ]'
        msg: "not on main"
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: "working tree has uncommitted changes"
      - sh: git fetch -q origin main && [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]
        msg: "main is not in step with origin/main; pull or push first"
      - sh: '! git rev-parse -q --verify "refs/tags/{{.TAG}}" >/dev/null'
        msg: "tag {{.TAG}} already exists, so version.go is still at the last release. Run task release:prepare RELEASE=<next> on a branch and merge it first"
      - sh: grep -q '^## {{.RELEASE}} ' CHANGELOG.md
        msg: "CHANGELOG.md has no '## {{.RELEASE}} — date' section; run task release:prepare"
      - sh: |
          grep -q '^  version: "{{.RELEASE}}"' build/config.yml
        msg: "build/config.yml's version doesn't match version.go ({{.RELEASE}})"
      - sh: command -v makensis >/dev/null && gh auth status >/dev/null 2>&1
        msg: "needs makensis and an authenticated gh"
    cmds:
      # VERSION is passed in, so the builds don't need the tag to exist yet and a
      # failed build leaves no tag behind.
      - '{{.TASK_EXE}} build build-win-installer VERSION={{.RELEASE}}'
      - rm -rf {{.DIST}} && mkdir -p {{.DIST}}
      - cp {{.BIN_DIR}}/katdown {{.DIST}}/katdown-linux-amd64
      - cp {{.BIN_DIR}}/katdown.exe {{.DIST}}/katdown-windows-amd64.exe
      - cp {{.BIN_DIR}}/katdown-amd64-installer.exe {{.DIST}}/katdown-windows-amd64-installer.exe
      - cd {{.DIST}} && sha256sum katdown-* > SHA256SUMS
      - awk '/^## /{if(p)exit} p; /^## {{.RELEASE}} /{p=1}' CHANGELOG.md > {{.DIST}}/NOTES.md
      - git tag -a {{.TAG}} -m "katdown {{.RELEASE}}"
      - git push origin {{.TAG}}
      - gh release create {{.TAG}} --verify-tag --title "katdown {{.RELEASE}}" --notes-file {{.DIST}}/NOTES.md {{.DIST}}/katdown-* {{.DIST}}/SHA256SUMS

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker
